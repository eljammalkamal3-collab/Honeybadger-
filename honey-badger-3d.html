<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرير العسل</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c07;--ink:#f6e9cf;--hot:#e8892b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120c07}}
:root[data-theme="dark"]{--bg:#120c07}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#w{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;gap:16px;padding:0 12px;pointer-events:none}
#hud>div{width:min(42vw,320px)}
#hud b{display:block;font-size:15px;margin-bottom:3px;text-shadow:0 1px 4px #000}
.bar{height:14px;background:rgba(0,0,0,.55);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.25);margin-bottom:4px}
.bar span{display:block;height:100%;width:100%;background:#6fd16a}
.bar.s{height:7px}
#rg{background:#b98a52}#rg.on{background:#ff7a1a}#eh{background:#e0503f}
#en{direction:ltr;text-align:left}
#ban{position:absolute;inset:24% 0 auto;text-align:center;font-family:Lalezar,Cairo,sans-serif;font-size:min(14vw,80px);line-height:1.1;color:#f6c76a;text-shadow:0 3px 14px #000;opacity:0;transition:opacity .4s;pointer-events:none}
#ban small{display:block;font:800 min(5vw,26px) Cairo,sans-serif;color:var(--ink)}
#ban.s{opacity:1}
#fl{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(190,20,10,.8);opacity:0;transition:opacity .4s}
#fl.s{opacity:1;transition:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(14,8,4,.82);text-align:center;padding:24px}
#ov.h{display:none}
h1{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:min(16vw,84px);margin:0;line-height:1.1;color:#f6c76a}
#ov p{margin:0;font-size:min(4.2vw,19px);max-width:34em;line-height:1.8}
#t3{opacity:.7;font-size:min(3.6vw,15px)}
button{font:800 18px Cairo,sans-serif;color:#fff;background:var(--hot);border:0;border-radius:12px;padding:.5em 1.8em;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ctl{position:absolute;left:0;right:0;bottom:12px;direction:ltr;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
#pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
#act{display:flex;gap:10px;align-items:flex-end}
#ctl button{pointer-events:auto;width:56px;height:56px;padding:0;font-size:26px;color:#fff;background:rgba(30,18,8,.55);border:2px solid rgba(255,255,255,.35);border-radius:50%;touch-action:none}
#ctl button.big{width:84px;height:84px;font-size:36px}
#ctl button:active{background:var(--hot)}
@media (hover:hover) and (pointer:fine){#ctl{display:none}}
</style>
</head>
<body>
<div id="w"><canvas id="c"></canvas>
<div id="hud"><div><b>الغرير</b><div class="bar"><span id="hp"></span></div><div class="bar s"><span id="rg"></span></div></div><div id="en"><b id="en_n"></b><div class="bar"><span id="eh"></span></div></div></div>
<div id="ban"></div><div id="fl"></div>
<div id="ov"><h1 id="t1"></h1><p id="t2"></p><p id="t3"></p><button id="go"></button></div>
<div id="ctl"><div id="pad"><button data-k="U" style="grid-area:1/2" aria-label="للأمام">▲</button><button data-k="L" style="grid-area:2/1" aria-label="يسار">◀</button><button data-k="R" style="grid-area:2/3" aria-label="يمين">▶</button><button data-k="D" style="grid-area:3/2" aria-label="للخلف">▼</button></div>
<div id="act"><button data-k="S" aria-label="غضب">✦</button><button data-k="B" aria-label="تفادي">⤾</button><button class="big" data-k="A" aria-label="هجوم">⚔</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),R=Math.random;
const L=[
{n:'أفعى الكوبرا',k:'snake',hp:70,s:2.6,d:8,cd:1.5,r:.7,env:['#f0b266','#f2c98c','#ffd9a0','#c9a56a']},
{n:'الضبع المرقّط',k:'quad',hp:100,s:3.8,d:10,cd:1.2,r:.85,o:{len:1.5,h:.95,w:.3,col:'#9a7a4a',spot:'rgba(40,25,10,.6)',dk:'#2a1c10'},env:['#e98f4a','#eeb77a','#ffc890','#bf9660']},
{n:'النمر',k:'quad',hp:130,s:5,d:12,cd:1.05,r:.9,o:{len:1.7,h:.85,w:.28,col:'#d89a38',spot:'rgba(30,15,5,.8)',dk:'#3a2410'},env:['#8a5a7e','#c9908a','#f2b080','#a98a5a']},
{n:'التمساح',k:'croc',hp:170,s:3,d:16,cd:1.3,r:1.3,env:['#5b8f94','#a8c9bd','#e8e2b8','#b3a26a']},
{n:'الأسد',k:'quad',hp:210,s:4.3,d:18,cd:1,r:1.05,o:{len:1.9,h:1.15,w:.36,col:'#cf913f',mane:'#6b3b17',dk:'#5a3a18'},env:['#c2452d','#d98a58','#ffb070','#b58a50']},
{n:'ملك الغابة الأسود',k:'quad',hp:280,s:4.8,d:22,cd:.9,r:1.15,o:{len:2.1,h:1.25,w:.4,col:'#34343c',mane:'#0e0e12',dk:'#15151a'},env:['#1b1a38','#3a2f55','#9ab0ff','#4a4658'],night:1}];
let ren,hemi,sun,ground,envG,sky,B,P,E,st='menu',lv=0,t=0,ban=0,shake=0,K={},last=0;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(55,1,.1,200);
const sph=new T.SphereGeometry(1,20,14),cyl=new T.CylinderGeometry(1,1,1,10),box=new T.BoxGeometry(1,1,1),cone=new T.ConeGeometry(1,1,8),dod=new T.DodecahedronGeometry(1,0);
const wht=new T.MeshStandardMaterial({color:0xf2ead6,roughness:.6}),yel=new T.MeshStandardMaterial({color:0xe8b820,roughness:.3}),blk=new T.MeshStandardMaterial({color:0x050505,roughness:.35}),red=new T.MeshStandardMaterial({color:0xd01c1c,roughness:.3});
function tex(b,o){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle=b;g.fillRect(0,0,256,256);
 if(o.top){g.fillStyle=o.top;g.fillRect(0,0,256,92);for(let y=0;y<26;y++){g.globalAlpha=1-y/26;g.fillRect(0,92+y,256,1)}g.globalAlpha=1}
 if(o.spot){g.fillStyle=o.spot;for(let i=0;i<60;i++){g.beginPath();g.ellipse(R()*256,R()*256,3+R()*6,3+R()*5,0,0,7);g.fill()}}
 if(o.sc){g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;for(let y=0;y<256;y+=14)for(let x=(y/14%2)*8;x<256;x+=16){g.beginPath();g.arc(x,y,8,0,3.14);g.stroke()}}
 for(let i=0;i<(o.sc?300:2200);i++){g.strokeStyle=(R()<.5?'rgba(255,255,255,':'rgba(0,0,0,')+R()*.14+')';g.lineWidth=1+R();const x=R()*256,y=R()*256;g.beginPath();g.moveTo(x,y);g.lineTo(x+(R()-.5)*8,y+R()*9);g.stroke()}
 const x=new T.CanvasTexture(c);x.encoding=T.sRGBEncoding;x.wrapS=x.wrapT=T.RepeatWrapping;if(o.rep)x.repeat.set(o.rep,o.rep);return x}
const mat=(b,o={})=>new T.MeshStandardMaterial({map:tex(b,o),roughness:.95});
function M(geo,m,x,y,z,sx,sy,sz,p){const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;p&&p.add(o);return o}
function leg(p,x,y,z,r,h,m){const q=new T.Group();q.position.set(x,y,z);M(cyl,m,0,-h/2,0,r,h,r,q);p.add(q);return q}
function mkBadger(){const g=new T.Group(),f=mat('#18120d',{top:'#e9e2cf'}),dk=mat('#0f0b08'),legs=[];
 M(sph,f,0,.42,0,.34,.29,.6,g);M(sph,f,0,.42,-.62,.11,.1,.2,g);
 const hd=new T.Group();hd.position.set(0,.4,.6);g.add(hd);
 M(sph,f,0,0,0,.2,.18,.26,hd);M(sph,blk,0,-.05,.27,.06,.05,.08,hd);
 for(const s of[-1,1]){M(sph,blk,s*.1,.07,.17,.028,.028,.028,hd);M(sph,f,s*.13,.17,-.03,.05,.05,.03,hd)}
 for(const z of[.34,-.3])for(const s of[-1,1]){const q=leg(g,s*.2,.28,z,.07,.28,dk);legs.push(q);if(z>0)for(const c of[-.03,0,.03])M(box,wht,c,-.29,.07,.012,.015,.06,q)}
 const sl=new T.Mesh(new T.TorusGeometry(.7,.035,6,20,2.2),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}));sl.position.set(0,.5,1.1);g.add(sl);
 return{g,legs,hd,sl,f}}
function mkQuad(o){const g=new T.Group(),m=mat(o.col,{spot:o.spot}),dk=mat(o.dk),H=o.h,N=o.len,legs=[];
 M(sph,m,0,H*.78,0,o.w,H*.36,N*.5,g);M(sph,m,0,H*.95,N*.38,o.w*.9,H*.34,N*.2,g);
 const hd=new T.Group();hd.position.set(0,H*1.02,N*.62);g.add(hd);
 M(sph,m,0,0,.05,o.w*.62,H*.2,N*.14,hd);M(sph,dk,0,-H*.05,N*.16,o.w*.3,H*.09,N*.1,hd);
 const jaw=new T.Group();jaw.position.set(0,-H*.1,N*.06);hd.add(jaw);M(box,m,0,-H*.02,N*.08,o.w*.4,H*.04,N*.16,jaw);
 for(const s of[-1,1]){M(sph,yel,s*o.w*.4,H*.06,N*.1,.03,.03,.03,hd);M(sph,m,s*o.w*.4,H*.2,0,.07,.07,.04,hd)}
 if(o.mane)M(sph,mat(o.mane),0,H*.98,N*.5,o.w*1.25,H*.5,N*.2,g);
 [[1,1],[-1,1],[1,-1],[-1,-1]].forEach(([s,z])=>legs.push(leg(g,s*o.w*.6,H*.62,z*N*.32,.07*H,H*.62,m)));
 const tl=M(cyl,m,0,H*.85,-N*.64,.035,N*.35,.035,g);tl.rotation.x=-1.27;
 return{g,legs,hd,jaw}}
function mkSnake(){const g=new T.Group(),m=mat('#7d8a3a',{sc:1}),seg=[],hd=new T.Group();
 for(let i=0;i<16;i++)seg.push(M(sph,m,0,0,0,1,1,1,g));
 g.add(hd);M(sph,mat('#a3b04a',{sc:1}),0,-.12,-.14,.34,.42,.07,hd);for(const s of[-1,1])M(sph,red,s*.07,.02,.1,.025,.025,.025,hd);
 return{g,seg,hd,lift:.3}}
function mkCroc(){const g=new T.Group(),m=mat('#4f7242',{sc:1}),legs=[];
 M(sph,m,0,.34,0,.55,.3,1.15,g);M(sph,m,0,.28,-1.2,.4,.2,.7,g);M(sph,m,0,.2,-1.9,.25,.14,.6,g);M(sph,m,0,.14,-2.4,.12,.08,.4,g);
 const hd=new T.Group();hd.position.set(0,.34,1.1);g.add(hd);M(box,m,0,.02,.55,.26,.12,.62,hd);
 const jaw=new T.Group();jaw.position.set(0,-.04,.05);hd.add(jaw);M(box,m,0,-.06,.5,.22,.08,.56,jaw);
 for(let i=0;i<7;i++)for(const s of[-1,1]){const q=M(cone,wht,s*.2,-.07,.15+i*.14,.018,.06,.018,hd);q.rotation.z=3.14}
 for(const s of[-1,1]){M(sph,yel,s*.15,.15,.18,.04,.04,.04,hd);for(const z of[.6,-.6]){const q=leg(g,s*.55,.3,z,.09,.3,m);q.rotation.z=s*.9;legs.push(q)}}
 return{g,legs,hd,jaw}}
function animSnake(s,tg){s.lift+=(tg-s.lift)*.2;
 for(let i=0;i<16;i++){const r=Math.max(.03,.13-i*.0065);s.seg[i].scale.setScalar(r);s.seg[i].position.set(Math.sin(t*3+i*.6)*.15*i/16,r+s.lift*Math.pow(Math.max(0,1-i/7),2)*1.1,-i*.22)}
 s.hd.position.copy(s.seg[0].position);s.hd.rotation.x=-s.lift*.3}
const puffs=[];
function setup(){ren=new T.WebGLRenderer({canvas:$('#c'),antialias:true});ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.outputEncoding=T.sRGBEncoding;ren.toneMapping=T.ACESFilmicToneMapping;ren.setPixelRatio(Math.min(devicePixelRatio,2));
 hemi=new T.HemisphereLight(0xffffff,0x554433,.7);scene.add(hemi);
 sun=new T.DirectionalLight(0xffffff,1.6);sun.position.set(-10,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=sc.bottom=-18;sc.right=sc.top=18;sc.far=60;scene.add(sun);
 ground=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshStandardMaterial({roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 sky=new T.Mesh(new T.SphereGeometry(120,24,16),new T.MeshBasicMaterial({side:T.BackSide,fog:false}));scene.add(sky);
 envG=new T.Group();scene.add(envG);B=mkBadger();scene.add(B.g);
 for(let i=0;i<24;i++){const m=new T.Mesh(sph,new T.MeshBasicMaterial({color:0xe3cfa0,transparent:true,opacity:0}));m.visible=false;scene.add(m);puffs.push({m,v:new T.Vector3(),l:0})}
 const rs=()=>{const w=$('#w'),a=w.clientWidth/w.clientHeight;ren.setSize(w.clientWidth,w.clientHeight,false);cam.aspect=a;cam.fov=a<1?78:55;cam.updateProjectionMatrix()};
 new ResizeObserver(rs).observe($('#w'));rs()}
function puff(x,y,z,n){for(let k=0;k<n;k++){const p=puffs.find(q=>q.l<=0);if(!p)return;p.l=.6;p.m.position.set(x,y,z);p.v.set((R()-.5)*3,R()*2.5,(R()-.5)*3);p.m.visible=true}}
function env(){const d=L[lv],[sk,fg,sn,gr]=d.env;scene.fog=new T.Fog(fg,16,75);
 hemi.color.set(sk);hemi.groundColor.set(gr);hemi.intensity=d.night?.5:.75;sun.color.set(sn);sun.intensity=d.night?.9:1.7;
 ground.material.map=tex(gr,{rep:100});ground.material.needsUpdate=true;
 const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');let gd=g.createLinearGradient(0,0,0,256);gd.addColorStop(0,sk);gd.addColorStop(.5,fg);gd.addColorStop(1,fg);g.fillStyle=gd;g.fillRect(0,0,512,256);
 gd=g.createRadialGradient(150,d.night?60:116,2,150,d.night?60:116,d.night?22:70);gd.addColorStop(0,d.night?'#fff':sn);gd.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gd;g.fillRect(0,0,512,256);
 if(d.night){g.fillStyle='#fff';for(let i=0;i<140;i++){g.globalAlpha=R();g.fillRect(R()*512,R()*110,1.5,1.5)}}
 const sx=new T.CanvasTexture(c);sx.encoding=T.sRGBEncoding;sky.material.map=sx;sky.material.needsUpdate=true;
 envG.clear();const rk=mat('#6f6358'),gm=new T.MeshStandardMaterial({color:d.night?'#3c3a2a':'#8a7a3a',roughness:1}),wd=new T.MeshStandardMaterial({color:'#4a3426',roughness:1}),lf=new T.MeshStandardMaterial({color:d.night?'#232e1c':'#556b2f',roughness:1});
 for(let i=0;i<26;i++){const a=i/26*6.283+R()*.2,rd=14.2+R()*1.2,s=.5+R()*.7,r=M(dod,rk,Math.cos(a)*rd,s*.4,Math.sin(a)*rd,s*1.2,s*.8,s,envG);r.rotation.y=R()*6;r.receiveShadow=true}
 for(let i=0;i<150;i++){const a=R()*6.283,rd=9+R()*40;M(cone,gm,Math.cos(a)*rd,.3,Math.sin(a)*rd,.07,.6,.07,envG).rotation.z=(R()-.5)*.4}
 for(let i=0;i<8;i++){const a=R()*6.283,rd=24+R()*22,x=Math.cos(a)*rd,z=Math.sin(a)*rd;M(cyl,wd,x,1.6,z,.13,3.2,.13,envG);M(sph,lf,x,3.4,z,2.3,.45,2.3,envG)}
 if(lv===3){const w=new T.Mesh(new T.CircleGeometry(6,32),new T.MeshStandardMaterial({color:'#2f5f6a',roughness:.1,metalness:.3}));w.rotation.x=-Math.PI/2;w.position.set(-11,.03,-9);envG.add(w)}}
function init(){const d=L[lv];if(E)scene.remove(E.m.g);
 const m=d.k==='snake'?mkSnake():d.k==='croc'?mkCroc():mkQuad(d.o);scene.add(m.g);
 E={m,x:0,z:5,hp:d.hp,s:'walk',tm:0,hurt:0,hit:0,dx:0,dz:1,mats:[]};
 m.g.traverse(o=>{if(o.material&&o.material.map&&!E.mats.includes(o.material))E.mats.push(o.material)});
 P={x:0,z:-4,hp:100,a:0,ac:0,hurt:0,rage:0,rt:0,hit:0,dt:0,dc:0,inv:0,dx:0,dz:0,mv:0,dmg:11+lv*2};
 B.g.rotation.z=0;$('#en_n').textContent=d.n;env()}
function show(a,b,c,f,h){$('#t1').textContent=a;$('#t2').textContent=b;$('#t3').textContent=h||'';$('#go').textContent=c;$('#go').onclick=()=>{$('#ov').classList.add('h');f()};$('#ov').classList.remove('h');$('#go').focus()}
function begin(){init();st='play';ban=2.4;$('#ban').innerHTML='المرحلة '+(lv+1)+'<small>الخصم: '+L[lv].n+'</small>'}
function menu(){show('غرير العسل','اهزم حيوانًا مختلفًا في نهاية كل مرحلة لتنتقل إلى التي بعدها. عندما يتوهّج الخصم باللون الأحمر فهو على وشك الهجوم، فتفادَ الضربة.','ابدأ اللعب',()=>{lv=0;begin()},'W A S D للحركة · مسافة للهجوم · Shift للتفادي · K للغضب')}
const cl=(o,r)=>{const l=Math.hypot(o.x,o.z);if(l>r){o.x*=r/l;o.z*=r/l}};
function upd(dt){const d=L[lv];
 for(const o of['hurt','a','ac','rt','dc','inv'])if(P[o]>0)P[o]-=dt;
 if(E.hurt>0)E.hurt-=dt;
 let fx=E.x-P.x,fz=E.z-P.z;const dist=Math.hypot(fx,fz)||1;fx/=dist;fz/=dist;
 const mx=(K.R?1:0)-(K.L?1:0),my=(K.U?1:0)-(K.D?1:0);let vx=-fz*mx+fx*my,vz=fx*mx+fz*my;const vl=Math.hypot(vx,vz);if(vl){vx/=vl;vz/=vl}
 P.mv=vl>0;
 if(P.dt>0){P.x+=P.dx*9*dt;P.z+=P.dz*9*dt;P.dt-=dt}else{const sp=5*(P.a>0?.5:1);P.x+=vx*sp*dt;P.z+=vz*sp*dt}
 if(K.B&&P.dc<=0&&P.dt<=0){P.dt=.32;P.inv=.4;P.dc=.9;P.dx=vl?vx:-fx;P.dz=vl?vz:-fz}
 if(ban>0){ban-=dt;if(ban<=0)$('#ban').classList.remove('s');else $('#ban').classList.add('s');cl(P,13);return}
 if(K.A&&P.ac<=0&&P.dt<=0){P.a=.3;P.ac=.45;P.hit=0}
 if(K.S&&P.rage>=100){P.rt=5;P.rage=0}
 if(P.a>0&&P.a<.2&&!P.hit&&dist<d.r+1.5){P.hit=1;E.hp-=P.dmg*(P.rt>0?2:1);E.hurt=.2;E.x+=fx*.3;E.z+=fz*.3;P.rage=Math.min(100,P.rage+14);puff(E.x-fx*d.r,.8,E.z-fz*d.r,8);shake=.18}
 const ex=-fx,ez=-fz;
 if(E.s==='walk'){E.x+=ex*d.s*dt;E.z+=ez*d.s*dt;if(dist<d.r+1.9){E.s='wind';E.tm=Math.max(.3,.55-lv*.045)}}
 else if(E.s==='wind'){E.tm-=dt;if(E.tm<=0){E.s='strike';E.tm=.24;E.hit=0;E.dx=ex;E.dz=ez}}
 else if(E.s==='strike'){if(dist>d.r+.6){E.x+=E.dx*d.s*3.4*dt;E.z+=E.dz*d.s*3.4*dt}E.tm-=dt;
  if(!E.hit&&dist<d.r+.8&&P.inv<=0&&P.hurt<=0){E.hit=1;P.hp-=d.d;P.hurt=.7;P.rage=Math.min(100,P.rage+10);puff(P.x,.5,P.z,8);shake=.35;const f=$('#fl');f.classList.add('s');setTimeout(()=>f.classList.remove('s'),60)}
  if(E.tm<=0){E.s='rest';E.tm=d.cd}}
 else{E.tm-=dt;if(E.tm<=0)E.s='walk'}
 const mn=d.r+.45,dd=Math.hypot(E.x-P.x,E.z-P.z);if(dd<mn){P.x-=fx*(mn-dd);P.z-=fz*(mn-dd)}
 cl(P,13);cl(E,13.5);
 if(E.hp<=0){E.hp=0;st='won';setTimeout(()=>lv<5?show('انتصرت!','هزمت '+d.n+'. الخصم التالي أقوى وأسرع.','المرحلة التالية',()=>{lv++;begin()}):show('أنت ملك الغابة','هزمت كل الحيوانات. لم يتبقَّ من يقف في وجه غرير العسل.','العب من جديد',()=>{lv=0;begin()}),1200)}
 else if(P.hp<=0){P.hp=0;st='lost';setTimeout(()=>show('سقط الغرير','خسرت أمام '+d.n+'. راقب توهّجه الأحمر وتفادَ ضربته ثم اضرب.','حاول مرة أخرى',begin),1100)}}
function sync(dt){const d=L[lv],g=E.m.g,w=E.s==='wind',s=E.s==='strike';
 B.g.position.set(P.x,0,P.z);B.g.rotation.y=Math.atan2(E.x-P.x,E.z-P.z);
 const sw=(P.mv||P.dt>0)?Math.sin(t*14):0;B.legs.forEach((l,i)=>l.rotation.x=sw*.7*(i===0||i===3?1:-1));
 B.g.scale.y=P.dt>0?.7:1;B.hd.rotation.x=P.a>0?.5:0;B.sl.material.opacity=P.a>0?P.a/.3:0;B.sl.rotation.z=(1-P.a/.3)*2-.5;
 B.g.visible=!(P.hurt>0&&Math.floor(t*30)%2);B.f.emissive.setHex(P.rt>0?0x662200:0);
 if(st==='lost')B.g.rotation.z=Math.min(1.4,B.g.rotation.z+dt*2.5);
 g.position.set(E.x,w?-.05:0,E.z);g.rotation.y=Math.atan2(P.x-E.x,P.z-E.z);
 if(E.m.legs){const q=E.s==='walk'?Math.sin(t*9):0;E.m.legs.forEach((l,i)=>l.rotation.x=q*.6*(i===0||i===3?1:-1))}
 if(E.m.jaw)E.m.jaw.rotation.x=w?.5:s?.9:0;
 if(d.k==='quad')E.m.hd.rotation.x=w?.3:0;
 if(d.k==='snake')animSnake(E.m,w?.9:s?.2:.35);
 const gl=E.hurt>0?0x777777:w?(Math.floor(t*14)%2?0x881100:0x300500):0;E.mats.forEach(m=>m.emissive.setHex(gl));
 if(st==='won')g.rotation.z=Math.min(1.4,g.rotation.z+dt*2)}
function camUpd(dt){let fx=E.x-P.x,fz=E.z-P.z;const l=Math.hypot(fx,fz)||1;fx/=l;fz/=l;const b=5.2+Math.min(l*.12,2);
 const tg=new T.Vector3(P.x-fx*b-fz*.9,2.6,P.z-fz*b+fx*.9);cam.position.lerp(tg,Math.min(1,dt*6));
 shake*=.88;cam.position.x+=(R()-.5)*shake;cam.position.y+=(R()-.5)*shake;cam.lookAt((P.x+E.x)/2,.8,(P.z+E.z)/2);sky.position.copy(cam.position)}
function hud(){const d=L[lv];$('#hp').style.width=P.hp+'%';const rg=$('#rg');rg.style.width=(P.rt>0?P.rt/5*100:P.rage)+'%';rg.className=P.rage>=100||P.rt>0?'on':'';$('#eh').style.width=E.hp/d.hp*100+'%'}
function loop(ms){const dt=Math.min(.05,(ms-last)/1000||0);last=ms;t+=dt;
 if(st==='play')upd(dt);
 sync(dt);camUpd(dt);
 for(const p of puffs)if(p.l>0){p.l-=dt;p.m.position.addScaledVector(p.v,dt);p.v.y-=3*dt;p.m.scale.setScalar(.08+(1-p.l/.6)*.25);p.m.material.opacity=Math.max(0,p.l/.6)*.7;if(p.l<=0)p.m.visible=false}
 ren.render(scene,cam);hud();requestAnimationFrame(loop)}
const map={w:'U',ArrowUp:'U',s:'D',ArrowDown:'D',a:'L',ArrowLeft:'L',d:'R',ArrowRight:'R',' ':'A',j:'A',Shift:'B',l:'B',k:'S'};
const kk=e=>map[e.key.length>1?e.key:e.key.toLowerCase()];
addEventListener('keydown',e=>{const k=kk(e);if(k&&st==='play'){K[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=kk(e);if(k)K[k]=0});
document.querySelectorAll('#ctl button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>K[k]=0))});
try{setup();init();menu();requestAnimationFrame(loop)}catch(e){show('تعذّر تشغيل اللعبة','المتصفح لا يدعم رسوميات WebGL المطلوبة. جرّب متصفحًا آخر.','إعادة المحاولة',()=>location.reload())}
</script>
